name: Go checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
      - run: go mod verify
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
